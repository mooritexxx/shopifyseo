name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          pip install -r backend/requirements-dev.txt
      - name: API smoke tests
        run: PYTHONPATH=. python -m pytest tests/test_api.py::test_operations_contract tests/test_api.py::test_settings_shopify_test_errors_without_credentials tests/test_rank_tracking.py tests/test_api_usage_summary.py tests/test_internal_links*.py tests/test_internal_link_allowlist.py -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Rankings, settings and internal-link UI tests
        working-directory: frontend
        run: npm test -- src/routes/rankings-page.test.tsx src/routes/settings-page.test.tsx src/routes/internal-links-page.test.tsx src/hooks/use-body-draft-sync.test.tsx
